<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark custom-navbar">
  <div class="container">
    <span class="navbar-brand">Dashboard</span>
    <button class="btn btn-light" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container mt-4">

  <h3>Welcome, <span id="username"></span></h3>

  <!-- Create Request -->
  <div class="card p-3 shadow mt-4">
    <h5>Create Service Request</h5>

   <!-- Issue Type Dropdown -->
<select id="issue" class="form-select mb-2">
  <option selected disabled>Select Issue Type</option>
  <option>Tyre Puncture</option>
  <option>Accident</option>
  <option>Battery Jumpstart</option>
  <option>Towing Service</option>
  <option>Engine Problem</option>
  <option>Fuel Delivery</option>
</select>

<!-- Vehicle Type Dropdown -->
<select id="vehicle" class="form-select mb-2">
  <option selected disabled>Select Vehicle Type</option>
  <option>Car</option>
  <option>Bike</option>
  <option>Mini Truck</option>
  <option>Truck</option>
</select>

    <input type="text" id="number" class="form-control mb-2" placeholder="Vehicle Number">
    <input type="text" id="location" class="form-control mb-2" placeholder="Location">
    <input type="text" id="description" class="form-control mb-2" placeholder="Description">

    <button class="btn booking-btn w-100" onclick="createRequest()">Submit</button>

    <p id="msg" class="text-success mt-2"></p>
  </div>

  <!-- My Requests -->
  <div class="card p-3 shadow mt-4">
    <h5>My Requests</h5>
    <button class="btn btn-dark mb-2" onclick="loadRequests()">Load Requests</button>

    <div id="requestList"></div>
  </div>

</div>

<script>
document.getElementById("username").innerText = localStorage.getItem("userName");

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

async function createRequest() {
  const userId = localStorage.getItem("userId");
  const issue = document.getElementById("issue").value;
  const vehicle = document.getElementById("vehicle").value;
  const vehicleNumber = document.getElementById("number").value;
  const locationText = document.getElementById("location").value;
  const description = document.getElementById("description").value;

  if (!issue || !vehicle || !vehicleNumber || !locationText || !description) {
    document.getElementById("msg").innerText = "Please fill all fields";
    return;
  }

  if (!navigator.geolocation) {
    document.getElementById("msg").innerText = "Geolocation is not supported by your browser";
    return;
  }

  document.getElementById("msg").innerText = "Fetching live location...";

  navigator.geolocation.getCurrentPosition(
    async function(position) {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      const data = {
        issueType: issue,
        vehicleType: vehicle,
        vehicleNumber: vehicleNumber,
        location: locationText,
        description: description,
        userId: parseInt(userId),
        latitude: latitude,
        longitude: longitude
      };

      const res = await fetch("http://localhost:8081/api/requests", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });

      const text = await res.text();
      document.getElementById("msg").innerText = text;
    },
    function(error) {
      document.getElementById("msg").innerText = "Location access denied or unavailable";
    }
  );
}

async function loadRequests() {
  const userId = localStorage.getItem("userId");

  const res = await fetch("http://localhost:8081/api/requests/user/" + userId);
  const data = await res.json();

  let html = "";

  data.forEach(r => {
    html += `
      <div class="service-card mt-2">
        <b>Issue:</b> ${r.issueType}<br>
        <b>Vehicle:</b> ${r.vehicleType}<br>
        <b>Status:</b> ${r.status}<br>
        <b>Latitude:</b> ${r.latitude ?? "N/A"}<br>
        <b>Longitude:</b> ${r.longitude ?? "N/A"}
      </div>
    `;
  });

  document.getElementById("requestList").innerHTML = html;
}
</script>

</body>
</html>
