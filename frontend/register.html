<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow login-card">

    <h3 class="text-center mb-3">Register</h3>

    <input type="text" id="name" class="form-control mb-2" placeholder="Name">
    <input type="email" id="email" class="form-control mb-2" placeholder="Email">
    <input type="password" id="password" class="form-control mb-2" placeholder="Password">
    <input type="text" id="phone" class="form-control mb-3" placeholder="Phone">

    <button class="btn booking-btn w-100" onclick="register()">Register</button>

    <p id="msg" class="text-success text-center mt-2"></p>

    <p class="text-center mt-3">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

    <p class="text-center">
      <a href="index.html">⬅ Back to Home</a>
    </p>

  </div>
</div>

<script>
async function register() {
  const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    phone: document.getElementById("phone").value
  };

  const res = await fetch("http://localhost:8081/api/auth/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  const text = await res.text();
  document.getElementById("msg").innerText = text;
}
</script>

</body>
</html>
