<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow login-card">
    <h3 class="text-center mb-3">Admin Login</h3>

    <input type="email" id="email" class="form-control mb-2" placeholder="Admin Email">
    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button class="btn booking-btn w-100" onclick="adminLogin()">Login</button>

    <p id="msg" class="text-danger text-center mt-3"></p>

    <p class="text-center mt-3">
      <a href="index.html">⬅ Back to Home</a>
    </p>
  </div>
</div>

<script>
async function adminLogin() {
  const data = {
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  };

  try {
    const res = await fetch("http://16.16.183.165:8081/api/admin/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const text = await res.text();
    console.log("Admin login response:", text);

    try {
      const result = JSON.parse(text);

      if (result.id && result.token) {
        localStorage.setItem("adminId", result.id);
        localStorage.setItem("adminName", result.name);
        localStorage.setItem("adminEmail", result.email);
        localStorage.setItem("adminToken", result.token);

        window.location.href = "admin.html";
        return;
      }
    } catch (e) {
    }

    document.getElementById("msg").innerText = text;

  } catch (error) {
    document.getElementById("msg").innerText = "Server not responding";
  }
}
</script>

</body>
</html>
