<!DOCTYPE html>
<html>
<head>
  <title>Agent Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow login-card">
    <h3 class="text-center mb-3">Agent Login</h3>

    <input type="email" id="email" class="form-control mb-2" placeholder="Agent Email">
    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button class="btn booking-btn w-100" onclick="agentLogin()">Login</button>

    <p id="msg" class="text-danger text-center mt-3"></p>

    <p class="text-center mt-3">
      <a href="index.html">⬅ Back to Home</a>
    </p>
  </div>
</div>

<script>
async function agentLogin() {
  const data = {
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  };

  const res = await fetch("http://16.16.183.165:8081/api/agents/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  const text = await res.text();

  try {
    const result = JSON.parse(text);

    if (result.id) {
      // ✅ SAVE TOKEN (VERY IMPORTANT)
      localStorage.setItem("agentId", result.id);
      localStorage.setItem("agentName", result.name);
      localStorage.setItem("agentToken", result.token);

      window.location.href = "agent-dashboard.html";
    }
  } catch {
    document.getElementById("msg").innerText = text;
  }
}
</script>

</body>
</html>
