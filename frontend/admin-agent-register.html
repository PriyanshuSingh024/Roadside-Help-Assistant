<!DOCTYPE html>
<html>
<head>
  <title>Register Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark custom-navbar">
  <div class="container">
    <span class="navbar-brand">Admin - Register Agent</span>
    <div>
      <a href="admin.html" class="btn btn-light me-2">Admin Panel</a>
      <a href="index.html" class="btn btn-warning">Home</a>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow p-4 rounded-4">
        <h3 class="mb-4 text-center">Register New Agent</h3>

        <input type="text" id="name" class="form-control mb-3" placeholder="Agent Name">
        <input type="email" id="email" class="form-control mb-3" placeholder="Agent Email">
        <input type="password" id="password" class="form-control mb-3" placeholder="Password">
        <input type="text" id="phone" class="form-control mb-3" placeholder="Phone Number">

        <button class="btn booking-btn w-100" onclick="registerAgent()">Register Agent</button>

        <p id="msg" class="text-center mt-3 fw-semibold"></p>
      </div>
    </div>
  </div>
</div>

<script>
async function registerAgent() {
  const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    phone: document.getElementById("phone").value
  };

  const res = await fetch("http://localhost:8080/api/agents/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  const text = await res.text();
  document.getElementById("msg").innerText = text;
}
</script>

</body>
</html>
